<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Muntliga snabbfrågor till Programmering 2 i Python.">
    <title>Snabbfrågor – Programmering 2 i Python</title>
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="snabbfragor.css">
</head>
<body>
    <header class="topbar">
        <a href="../index.html">← Till kursens startsida</a>
        <span>Programmering 2 i Python</span>
    </header>

    <main class="overview">
        <p class="eyebrow">Muntliga snabbfrågor</p>
        <h1>Slumpade frågor</h1>
        <p class="intro">Frågorna från kapitel 1.2–1.5 visas i slumpmässig ordning. Tänk ut ditt svar innan du visar facit.</p>

        <section class="random-card" aria-labelledby="question-heading" aria-live="polite">
            <div class="random-card-meta">
                <span data-chapter>Kapitel 1.2</span>
                <span><span data-position>1</span> av 20</span>
            </div>
            <h2 id="question-heading" data-question></h2>
            <div class="random-answer" data-answer hidden>
                <p data-answer-text></p>
                <pre data-code-wrapper hidden><code data-code></code></pre>
            </div>
            <div class="random-actions">
                <button type="button" data-show-answer>Visa facit</button>
                <button type="button" data-next-question hidden>Nästa slumpfråga →</button>
            </div>
        </section>
    </main>
    <script src="slumpfragor.js"></script>
</body>
</html>
